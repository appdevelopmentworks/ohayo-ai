name: ci

# Tests on code changes to main. Runs only in this repository, never for forks,
# and needs no secrets (tests use recorded fixtures only).
on:
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "public/**"
      - "docs/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'appdevelopmentworks/ohayo-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Test
        run: uv run pytest
